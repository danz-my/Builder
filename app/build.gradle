plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zerusoft'
    compileSdk 35

    defaultConfig {
        applicationId "com.zerusoft"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    // Kunci sign release DIAMBIL DARI ENV VAR (diisi CI dari GitHub
    // Secrets — lihat .github/workflows/build.yml). Kalau env var kosong
    // (misal build lokal tanpa keystore), otomatis fallback ke debug key
    // biar tetap bisa build, TAPI APK-nya nggak akan bisa "update install"
    // menimpa APK release resmi (beda kunci).
    def hasReleaseKeystore = System.getenv("ZERUSOFT_KEYSTORE_PATH") != null

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(System.getenv("ZERUSOFT_KEYSTORE_PATH"))
                storePassword System.getenv("ZERUSOFT_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ZERUSOFT_KEY_ALIAS")
                keyPassword System.getenv("ZERUSOFT_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.0'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.0'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
