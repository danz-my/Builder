name: 🚀 Build APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versi APK (contoh: 1.0, 1.1, 2.0)'
        required: false
        default: '1.0'
      version_code:
        description: 'Kode versi (angka bulat, selalu naik)'
        required: false
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 🔧 Install Gradle & Regenerate Wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/g.zip
          unzip -q /tmp/g.zip -d /opt/
          export PATH="/opt/gradle-8.7/bin:$PATH"
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew

      - name: 📝 Set Version
        if: github.event_name == 'workflow_dispatch'
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.event.inputs.version_code }}/" app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "${{ github.event.inputs.version_name }}"/' app/build.gradle

      - name: 🔨 Build APK
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: 📛 Rename APK
        run: |
          VERSION=$(grep versionName app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/' | tr -d '[:space:]')
          DATE=$(date +%Y%m%d)
          mkdir -p app/build/outputs/apk/renamed
          find app/build/outputs/apk/debug -name "*.apk" | head -1 | xargs -I{} cp {} "app/build/outputs/apk/renamed/ZeruSoft-v${VERSION}-debug-${DATE}.apk"
          find app/build/outputs/apk/release -name "*.apk" | head -1 | xargs -I{} cp {} "app/build/outputs/apk/renamed/ZeruSoft-v${VERSION}-release-${DATE}.apk"
          ls app/build/outputs/apk/renamed/

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeruSoft-APK
          path: app/build/outputs/apk/renamed/*.apk
          retention-days: 30
